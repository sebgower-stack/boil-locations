<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seafood Boils of the World</title><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#fff;font-family:-apple-system,system-ui,sans-serif}
nav{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:6px 8px;background:#000e;backdrop-filter:blur(6px)}
nav button{background:#222;color:#fff;border:0;border-radius:18px;padding:8px 18px;font-size:15px;font-weight:700}nav button.on{background:#FF4D1D}
nav .s{margin-left:auto;font-size:11px;opacity:.7;text-align:right}nav a{color:#9cf}
.gh{position:sticky;top:46px;z-index:4;padding:6px 8px;font-size:14px;font-weight:700;background:linear-gradient(#000d,#0000)}
.gh small{font-weight:400;opacity:.7}.gh b{font-size:10px;padding:1px 5px;border-radius:3px;margin-left:4px}
.ms{columns:2 140px;column-gap:3px;padding:0 3px}@media(min-width:700px){.ms{columns:5 200px}}
.m{break-inside:avoid;margin:0 0 3px;position:relative;cursor:zoom-in}.m img{display:block;width:100%;height:auto;background:#222}
.m a{position:absolute;right:3px;bottom:3px;background:#000a;color:#fff;font-size:11px;padding:1px 5px;border-radius:3px;text-decoration:none}
#lb{position:fixed;inset:0;background:#000f;z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center}
#lb img{max-width:100vw;max-height:84vh;object-fit:contain}#lb .c{padding:8px;font-size:13px;text-align:center}#lb .c a{color:#9cf;margin:0 6px}
#lb .x,#lb .p,#lb .n{position:absolute;background:#0008;color:#fff;border:0;font-size:28px;padding:6px 14px;cursor:pointer}#lb .x{top:8px;right:8px}#lb .p{left:4px;top:45%}#lb .n{right:4px;top:45%}
</style></head><body><nav><button data-t="L" class="on">Location</button><button data-t="F">Food</button><div class="s">58 countries · 522 restaurants · 4257 photos<br><span id="tc"></span> · <a href="dashboard.html">dashboard &amp; NZ watch</a></div></nav>
<div id="g"></div><div id="lb"><button class="x">×</button><button class="p">‹</button><img alt=""><button class="n">›</button><div class="c"></div></div>
<script>
let D,cur=[],ix=0;const g=document.getElementById('g'),lb=document.getElementById('lb'),li=lb.querySelector('img'),lc=lb.querySelector('.c');
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function show(t){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));cur=D[t];
 document.getElementById('tc').textContent=(t=='L'?'Location: ':'Food: ')+cur.length+' photos';let h='',k=null,cn=null;
 cur.forEach((p,i)=>{const v=D.v[p[4]];const key=t=='L'?p[4]:v[1];
  if(key!==k){if(k!==null)h+='</div>';k=key;
   h+=t=='L'?'<div class="gh">'+(v[1]!==cn?'📍 '+e(v[1])+' › ':'')+'<a style="color:#fff" href="r/'+p[4]+'.html">'+e(v[0])+'</a> <small>'+e(v[2])+'</small><b style="background:'+v[4]+'">'+e(v[3])+'</b></div><div class="ms">':'<div class="gh">🦞 '+e(v[1])+'</div><div class="ms">';cn=v[1]}
  h+='<div class="m" data-i="'+i+'"><img src="img/'+p[0]+'" width="'+p[2]+'" height="'+p[3]+'" loading="lazy" alt=""><a href="'+e(p[5])+'" target="_blank" rel="noopener">↗</a></div>'});
 g.innerHTML=h+'</div>';scrollTo(0,0);history.replaceState(0,'','#'+t)}
function open_(i){ix=(i+cur.length)%cur.length;const p=cur[ix],v=D.v[p[4]];li.src='img/'+p[1];
 lc.innerHTML='<b>'+e(v[0])+'</b> · '+e(p[7]||v[2])+' · '+e(v[1])+' · '+(p[6]=='B'?'brand photo':'guest photo')+'<br><a href="'+e(p[5])+'" target="_blank" rel="noopener">Photo source ↗</a><a href="r/'+p[4]+'.html">Venue page →</a>';lb.style.display='flex'}
g.onclick=ev=>{if(ev.target.closest('a'))return;const m=ev.target.closest('.m');if(m)open_(+m.dataset.i)};
lb.querySelector('.x').onclick=()=>lb.style.display='none';lb.querySelector('.p').onclick=()=>open_(ix-1);lb.querySelector('.n').onclick=()=>open_(ix+1);
li.onclick=()=>open_(ix+1);document.onkeydown=ev=>{if(lb.style.display!='flex')return;if(ev.key=='Escape')lb.style.display='none';if(ev.key=='ArrowRight')open_(ix+1);if(ev.key=='ArrowLeft')open_(ix-1)};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.t));
fetch('tabs.json').then(r=>r.json()).then(j=>{D=j;show(location.hash=='#F'?'F':'L')});
</script></body></html>
